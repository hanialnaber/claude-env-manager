[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-env-manager"
version = "0.1.1"
description = "Add, check and manage the environment variables Claude Code uses. Local only, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["claude", "claude-code", "environment-variables", "settings", "dotenv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Web Environment",
  "Topic :: Software Development",
]
dependencies = []

[project.scripts]
claude-env = "claude_env_manager.cli:main"

[tool.setuptools]
packages = ["claude_env_manager"]

[tool.setuptools.package-data]
claude_env_manager = ["ui/*", "ui/fonts/*"]
