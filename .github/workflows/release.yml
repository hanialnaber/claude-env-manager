name: Release

# Builds the Windows and macOS apps and attaches them, with SHA-256
# checksums, to a GitHub release. Start it either way:
#   - Actions tab > Release > Run workflow, and type a version like v0.1.0
#   - or push a tag like v0.1.0
#
# The release is made as a draft and only published once every build is
# attached, so nobody sees a release with missing downloads. Re-running is
# safe: files already attached are replaced.
#
# macOS runners can sit in GitHub's queue for 10+ minutes when they're
# busy. That's normal; leave the run going.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release, e.g. v0.1.0"
        required: true
        default: "v0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # The full Windows, macOS and Linux test matrix runs on every push to main
  # (see ci.yml), so the release gate stays quick.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Tag must look like v0.1.0"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create a draft release (skipped if it already exists)
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" --draft \
              --target "$GITHUB_SHA" \
              --title "Claude Env Manager $TAG" \
              --notes-file RELEASE_NOTES.md
          fi

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ClaudeEnvManager-windows-x64.exe
          - os: macos-latest
            asset: ClaudeEnvManager-macos-apple-silicon.zip
          - os: macos-15-intel
            asset: ClaudeEnvManager-macos-intel.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller==6.11.1

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console \
            --name ClaudeEnvManager \
            --collect-data claude_env_manager \
            packaging/launcher.py
          cp dist/ClaudeEnvManager.exe "${{ matrix.asset }}"

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed \
            --name "Claude Env Manager" \
            --osx-bundle-identifier io.github.hanialnaber.claude-env-manager \
            --collect-data claude_env_manager \
            packaging/launcher.py
          ditto -c -k --keepParent "dist/Claude Env Manager.app" "${{ matrix.asset }}"

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256";
          else shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; fi

      - name: Attach to release
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" "${{ matrix.asset }}" "${{ matrix.asset }}.sha256" --clobber

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        shell: bash
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
