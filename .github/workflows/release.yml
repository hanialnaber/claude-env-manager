name: Release

# Push a tag like v0.1.0 to build the Windows and macOS apps and attach
# them, with SHA-256 checksums, to a GitHub release for that tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ClaudeEnvManager-windows-x64.exe
          - os: macos-latest
            asset: ClaudeEnvManager-macos-apple-silicon.zip
          - os: macos-15-intel
            asset: ClaudeEnvManager-macos-intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller==6.11.1

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console \
            --name ClaudeEnvManager \
            --collect-data claude_env_manager \
            packaging/launcher.py
          cp dist/ClaudeEnvManager.exe "${{ matrix.asset }}"

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed \
            --name "Claude Env Manager" \
            --osx-bundle-identifier io.github.hanialnaber.claude-env-manager \
            --collect-data claude_env_manager \
            packaging/launcher.py
          ditto -c -k --keepParent "dist/Claude Env Manager.app" "${{ matrix.asset }}"

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256";
          else shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; fi

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          name: Claude Env Manager ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
