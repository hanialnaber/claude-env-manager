name: Release

# Builds the Windows and macOS apps and attaches them, with SHA-256
# checksums, to a GitHub release. Start it either way:
#   - Actions tab > Release > Run workflow, and type a version like v0.1.0
#   - or push a tag like v0.1.0
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create and release, e.g. v0.1.0"
        required: true
        default: "v0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "Tag must look like v0.1.0"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Create the release (and the tag, if it doesn't exist yet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Claude Env Manager ${{ steps.tag.outputs.tag }}
          body_path: RELEASE_NOTES.md

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ClaudeEnvManager-windows-x64.exe
          - os: macos-latest
            asset: ClaudeEnvManager-macos-apple-silicon.zip
          - os: macos-15-intel
            asset: ClaudeEnvManager-macos-intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller==6.11.1

      - name: Build Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --console \
            --name ClaudeEnvManager \
            --collect-data claude_env_manager \
            packaging/launcher.py
          cp dist/ClaudeEnvManager.exe "${{ matrix.asset }}"

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed \
            --name "Claude Env Manager" \
            --osx-bundle-identifier io.github.hanialnaber.claude-env-manager \
            --collect-data claude_env_manager \
            packaging/launcher.py
          ditto -c -k --keepParent "dist/Claude Env Manager.app" "${{ matrix.asset }}"

      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256";
          else shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"; fi

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
